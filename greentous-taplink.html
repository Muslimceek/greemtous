<style>
  :root{
    --ink:#04100A;
    --plaque:#000000;
    --line:rgba(163,201,175,.16);
    --line-strong:rgba(163,201,175,.30);
    --green:#39F03D;
    --green-mid:#2ECB35;
    --green-deep:#1B8A26;
    --green-soft:rgba(57,240,61,.13);
    --gold:#C7A667;
    --text:#EAF3EC;
    --muted:#8CA795;
    --ui:"Golos Text","Helvetica Neue",Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  img{max-width:100%;}
  [hidden]{display:none !important;}

  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  html[lang="ar"] body{ font-family:"Cairo","Golos Text",Arial,sans-serif; }

  .glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(58% 32% at 50% 6%, rgba(57,240,61,.20), transparent 70%),
      radial-gradient(44% 26% at 10% 46%, rgba(27,138,38,.18), transparent 72%),
      radial-gradient(46% 30% at 92% 80%, rgba(199,166,103,.10), transparent 74%),
      linear-gradient(180deg,#06170B 0%, #04100A 46%, #010704 100%);
  }
  .grain{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:3px 3px;
  }

  .wrap{
    position:relative; z-index:1;
    width:100%; max-width:460px; margin:0 auto;
    padding:18px 20px calc(34px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:24px;
  }

  /* ---------- language switch ---------- */
  .langs{
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap;
    padding:5px; border-radius:999px;
    border:1px solid var(--line); background:rgba(255,255,255,.03);
    align-self:center;
  }
  .lang{
    appearance:none; border:0; cursor:pointer;
    font-family:var(--ui); font-size:12.5px; font-weight:600; letter-spacing:.6px;
    color:var(--muted); background:transparent;
    padding:8px 12px; border-radius:999px; min-height:34px;
    transition:color .16s ease, background .16s ease;
  }
  .lang[aria-pressed="true"]{ color:#04170A; background:var(--green-mid); }
  .lang:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }

  /* ---------- plaque ---------- */
  .plaque{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .badge-wrap{ position:relative; width:100%; max-width:352px; }
  .badge-wrap::before{
    content:""; position:absolute; inset:-14% -6%; z-index:-1;
    background:radial-gradient(50% 50% at 50% 50%, rgba(57,240,61,.20), transparent 72%);
    filter:blur(6px);
  }
  .badge{ display:block; width:100%; height:auto;
    filter:drop-shadow(0 18px 34px rgba(0,0,0,.8)) drop-shadow(0 0 26px rgba(57,240,61,.16)); }

  .kicker{
    font-size:11px; font-weight:600; letter-spacing:2.6px; text-transform:uppercase;
    color:var(--muted); display:flex; align-items:center; gap:10px;
  }
  .kicker::before,.kicker::after{ content:""; width:26px; height:1px; background:var(--line-strong); }
  html[lang="ar"] .kicker{ letter-spacing:0; font-size:12.5px; }

  .lede{
    text-align:center; color:var(--muted); font-size:15px; line-height:1.6;
    max-width:32ch; margin:0 auto; text-wrap:balance;
  }

  /* ---------- links ---------- */
  .links{ display:flex; flex-direction:column; gap:12px; }

  .row{
    display:flex; align-items:center; gap:14px;
    min-height:68px; padding:12px 16px;
    border-radius:16px; text-decoration:none; color:var(--text);
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.022));
    border:1px solid var(--line);
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .row:active{ transform:scale(.985); }
  .row:focus-visible{ outline:2px solid var(--green); outline-offset:3px; }

  .row .ico{
    flex:0 0 44px; width:44px; height:44px; border-radius:13px;
    display:grid; place-items:center;
    background:rgba(255,255,255,.06); border:1px solid var(--line);
  }
  .row .ico svg{ width:22px; height:22px; display:block; }
  .row .txt{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .row .t{ font-size:16px; font-weight:600; letter-spacing:-.1px; }
  .row .s{ font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .go{ margin-inline-start:auto; flex:0 0 auto; color:var(--muted); }
  .row .go svg{ width:18px; height:18px; display:block; }
  html[dir="rtl"] .row .go svg{ transform:scaleX(-1); }
  .row .s bdi{ unicode-bidi:isolate; }

  .row.primary{
    background:linear-gradient(180deg, #3FDF4A, #1B8A26);
    border-color:rgba(255,255,255,.22);
    color:#021507;
    box-shadow:0 14px 30px rgba(27,138,38,.34);
  }
  .row.primary .ico{ background:rgba(2,21,7,.20); border-color:rgba(2,21,7,.18); }
  .row.primary .s{ color:rgba(2,21,7,.74); }
  .row.primary .go{ color:rgba(2,21,7,.6); }

  /* ---------- utilities ---------- */
  .utils{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .util{
    display:flex; align-items:center; justify-content:center; gap:9px;
    min-height:52px; padding:0 12px; border-radius:14px;
    font-family:inherit; font-size:14px; font-weight:600; color:var(--text);
    background:transparent; border:1px dashed var(--line-strong);
    text-decoration:none; cursor:pointer; text-align:center;
    transition:border-color .18s ease, color .18s ease;
  }
  .util svg{ width:17px; height:17px; flex:0 0 auto; }
  .util:active{ border-color:var(--green); color:var(--green); }
  .util:focus-visible{ outline:2px solid var(--green); outline-offset:3px; }

  /* ---------- footer ---------- */
  .foot{ display:flex; flex-direction:column; align-items:center; gap:10px; }
  .rule{ width:100%; height:1px; background:linear-gradient(90deg, transparent, var(--line-strong), transparent); }
  .foot p{ margin:0; font-size:12px; color:var(--muted); letter-spacing:.3px; text-align:center; }
  .foot .gold{ color:var(--gold); font-weight:600; }

  #toast{
    position:fixed; left:50%; bottom:calc(26px + env(safe-area-inset-bottom));
    transform:translate(-50%,16px); z-index:5;
    background:#0B1E12; color:var(--text); border:1px solid var(--line-strong);
    padding:11px 18px; border-radius:999px; font-size:13px; font-weight:600;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  #toast.on{ opacity:1; transform:translate(-50%,0); }

  @media (hover:hover){
    .row:hover{ border-color:var(--line-strong); background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04)); }
    .row.primary:hover{ background:linear-gradient(180deg,#4CEB57,#22A32F); }
    .util:hover{ border-color:var(--green); color:var(--green); }
    .lang:hover{ color:var(--text); }
    .lang[aria-pressed="true"]:hover{ color:#04170A; }
  }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>
